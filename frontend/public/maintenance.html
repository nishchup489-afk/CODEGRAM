<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DevManiac — Major Update Coming Soon</title>

    <meta
        name="description"
        content="DevManiac is currently undergoing a major update."
    />

    <meta name="robots" content="noindex, nofollow" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: #fff;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            width: min(680px, 90%);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 7px 12px;
            margin-bottom: 28px;

            border: 1px solid rgba(249, 115, 22, 0.35);
            border-radius: 999px;

            color: #fb923c;
            background: rgba(249, 115, 22, 0.08);

            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1;
            letter-spacing: -0.05em;
            margin-bottom: 24px;
        }

        p {
            max-width: 560px;
            margin: auto;

            color: #a1a1aa;
            font-size: 18px;
            line-height: 1.7;
        }

        strong {
            color: #fff;
        }

        .footer {
            margin-top: 48px;
            color: #52525b;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main>
        <div class="badge">
            Under Development
        </div>

        <h1>
            Something bigger is coming.
        </h1>

        <p>
            DevManiac is currently undergoing a
            <strong>major rebuild.</strong>

            We're rethinking how developers capture,
            prove, and present the work that GitHub
            doesn't show.
        </p>

        <p style="margin-top: 18px;">
            The new DevManiac is coming soon.
        </p>

        <div class="footer">
            © 2026 DevManiac
        </div>
    </main>
</body>
</html>
