name: Backend checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: codegram_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d codegram_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@127.0.0.1:5432/codegram_test
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: python -m pip install poetry==2.4.1

      - name: Verify dependency lock
        run: poetry check --lock

      - name: Install backend dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Compile backend modules
        run: poetry run python -m compileall -q app alembic

      - name: Verify migration graph has one head
        run: test "$(poetry run alembic heads | wc -l | tr -d ' ')" = "1"

      - name: Replay migrations on fresh PostgreSQL
        run: poetry run alembic upgrade head

      - name: Run backend tests
        run: poetry run pytest
